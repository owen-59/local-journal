analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/providers/entry_list.dart
include: 
 - package:lints/recommended.yaml
 - package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.1.9

linter:
  rules:
    - prefer_double_quotes
    - always_declare_return_types
